<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spids Manager">
<title>Spids Manager</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#687386;--line:#e2e6ec;--primary:#176b3a;--blue:#2563eb;--red:#b91c1c;--orange:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:50;background:#111827;color:#fff;padding:13px 14px calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:12px;background:#d9f24b;color:#111827;display:grid;place-items:center;font-size:21px;font-weight:900}.top h1{margin:0;font-size:20px}.top small{color:#cbd5e1}.top .save{margin-left:auto}
.wrap{max-width:1250px;margin:auto;padding:10px 12px 105px}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;position:sticky;top:69px;z-index:40;background:var(--bg)}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700;color:#374151}.nav button.active{background:#111827;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.stat{min-height:105px}.stat .v{font-size:24px;font-weight:900;margin-top:8px}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}.section-title h2,.section-title h3{margin:0}
.btn{border:0;border-radius:10px;padding:10px 13px;background:#e5e7eb;color:#111827;font-weight:750}.btn.primary{background:var(--primary);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn.dark{background:#1f2937;color:#fff}.btn.sm{padding:7px 9px;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:800;color:#374151;margin:8px 0 5px}input,select,textarea{width:100%;border:1px solid #cfd5dd;border-radius:10px;padding:10px;background:#fff;color:#111827}textarea{min-height:90px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f8fafc}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#eef2ff;color:#3730a3}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.dangertext{color:var(--red);font-weight:800}.success{color:#166534;font-weight:800}.empty{text-align:center;padding:28px;color:var(--muted)}
.project{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px}.project h3{margin:0 0 5px}.actions{display:flex;gap:7px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.mini{background:#f8fafc;border-radius:10px;padding:8px}.mini b{display:block;margin-top:3px}
.gantt{overflow:auto}.gantt-row{display:grid;grid-template-columns:190px 1fr;min-width:700px;border-bottom:1px solid var(--line);min-height:42px}.gantt-name{padding:10px;font-weight:700}.gantt-track{position:relative;background:repeating-linear-gradient(90deg,#fff 0,#fff 49px,#eef1f5 50px)}.bar{position:absolute;top:9px;height:24px;border-radius:8px;background:#176b3a;color:#fff;padding:3px 8px;font-size:11px;overflow:hidden;white-space:nowrap}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:60}.bottom button{border:0;background:transparent;color:#374151;font-weight:800;font-size:11px}.bottom button span{display:block;font-size:20px;margin-bottom:2px}.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.two,.formgrid{grid-template-columns:1fr}}
@media(max-width:520px){.wrap{padding:9px 9px 100px}.grid{gap:8px}.card{padding:12px}.stat{min-height:90px}.stat .v{font-size:20px}.project{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<header class="top"><div class="logo">S</div><div><h1>Spids Manager</h1><small id="subtitle">Mes chantiers</small></div><div class="save"><button class="btn sm dark" onclick="exportData()">💾</button></div></header>
<div class="wrap"><div class="nav" id="nav"></div><main id="view"></main></div>
<div class="bottom"><button onclick="go('dashboard')"><span>🏠</span>Accueil</button><button onclick="go('chantiers')"><span>🏗️</span>Chantiers</button><button onclick="go('ouvriers')"><span>👷</span>Ouvriers</button><button onclick="go('finances')"><span>💰</span>Finances</button><button onclick="go('plus')"><span>☰</span>Plus</button></div>

<script>
const KEY='spids_manager_new';
const empty={projects:[],workers:[],attendance:[],advances:[],materials:[],meters:[],expenses:[],payments:[],invoices:[],suppliers:[],tasks:[],meetings:[],documents:[],photos:[],samples:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||empty;Object.keys(empty).forEach(k=>{if(!db[k])db[k]=[]});
let currentProject=localStorage.getItem('spids_project')||'';let page='dashboard';
const nav=[['dashboard','🏠 Accueil'],['chantiers','🏗️ Chantiers'],['project','📌 Chantier actif'],['ouvriers','👷 Ouvriers'],['attendance','🕘 Heures'],['advances','💶 Avances'],['materials','🧱 Matériel'],['meters','📏 Métrés'],['expenses','💸 Dépenses'],['payments','💵 Recettes'],['invoices','🧾 Facturation'],['planning','📅 Planning + Gantt'],['meetings','🤝 Réunions'],['documents','📄 Documents'],['photos','📸 Photos'],['finances','📊 Tableau financier']];
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function today(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' DH'}function pid(){return currentProject}function pname(){return db.projects.find(p=>p.id===pid())?.name||'Aucun chantier sélectionné'}function filt(x){return !pid()||x.projectId===pid()}function sum(t,f=()=>true,field='amount'){return db[t].filter(f).reduce((a,x)=>a+(Number(x[field])||0),0)}
function go(p){page=p;render();scrollTo(0,0)}function setProject(x){currentProject=x;localStorage.setItem('spids_project',x);go('project')}
function render(){document.getElementById('nav').innerHTML=nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');document.getElementById('subtitle').textContent=pid()?pname():'Mes chantiers';document.getElementById('view').innerHTML=(views[page]||views.dashboard)()}
function modal(t,b){document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#0008;z-index:100;padding:15px;overflow:auto"><div class="card" style="max-width:800px;margin:35px auto"><div class="section-title"><h2>${t}</h2><button class="btn sm" onclick="closeModal()">✕</button></div>${b}</div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
function pselect(){return '<option value="">Choisir un chantier</option>'+db.projects.map(p=>`<option value="${p.id}" ${p.id===pid()?'selected':''}>${esc(p.name)}</option>`).join('')}
function pf(){return `<label>Chantier<select id="fproject">${pselect()}</select></label>`}
function projectCard(p){let e=sum('expenses',x=>x.projectId===p.id),r=sum('payments',x=>x.projectId===p.id),w=db.workers.filter(x=>x.projectId===p.id).length;return `<div class="project"><div><h3>🏗️ ${esc(p.name)}</h3><span class="muted">${esc(p.client||'Sans client')} · ${esc(p.address||'')}</span><div class="kpis"><div class="mini">Budget<b>${money(p.budget)}</b></div><div class="mini">Dépenses<b>${money(e)}</b></div><div class="mini">Ouvriers<b>${w}</b></div></div></div><div class="actions"><button class="btn sm primary" onclick="setProject('${p.id}')">Ouvrir</button><button class="btn sm danger" onclick="delProject('${p.id}')">Supprimer</button></div></div>`}
function addProject(){modal('🏗️ Nouveau chantier',`<div class="formgrid"><label>Nom du chantier<input id="name" placeholder="Chantier A"></label><label>Client<input id="client"></label><label>Budget DH<input id="budget" type="number"></label><label>Adresse<input id="address"></label><label>Date début<input id="start" type="date"></label><label>Date fin<input id="end" type="date"></label><label class="full">Description<textarea id="notes"></textarea></label></div><button class="btn primary" onclick="saveProject()">Créer le chantier</button>`)}
function saveProject(){let p={id:id(),name:document.getElementById('name').value||'Chantier sans nom',client:document.getElementById('client').value,budget:+document.getElementById('budget').value||0,address:document.getElementById('address').value,start:document.getElementById('start').value,end:document.getElementById('end').value,notes:document.getElementById('notes').value};db.projects.push(p);currentProject=p.id;localStorage.setItem('spids_project',p.id);closeModal();save();go('project')}
function delProject(x){if(!confirm('Supprimer le chantier et toutes ses données ?'))return;Object.keys(empty).forEach(k=>{db[k]=db[k].filter?.(z=>z.projectId!==x)??db[k]});db.projects=db.projects.filter(z=>z.id!==x);if(pid()===x){currentProject='';localStorage.removeItem('spids_project')}save();go('chantiers')}
function del(t,x){if(confirm('Supprimer ?')){db[t]=db[t].filter(z=>z.id!==x);save()}}
function simplePage(title,type,cols,row,add){
  if(!currentProject){
    return `<div class="card empty"><h2>${title}</h2><p>Sélectionnez d’abord un chantier.</p><button class="btn primary" onclick="go('chantiers')">🏗️ Choisir un chantier</button></div>`;
  }
  const a=db[type].filter(x=>x.projectId===currentProject);
  const buttons={
    workers:'addWorker',
    attendance:'addAttendance',
    advances:'addAdvance',
    materials:'addMaterial',
    meters:'addMeter',
    expenses:'addExpense',
    payments:'addPayment',
    invoices:'addInvoice',
    tasks:'addTask',
    meetings:'addMeeting'
  };
  const fn=buttons[type];
  return `${activeProjectBar ? activeProjectBar() : ''}
  <div class="section-title"><div><h2>${title}</h2><span class="muted">${esc(pname())}</span></div><button class="btn primary" onclick="${fn}()">＋ Ajouter</button></div>
  <div class="card"><div class="tablewrap">${a.length?`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr>${a.map(x=>`<tr>${row(x).map(v=>`<td>${v}</td>`).join('')}<td><button class="btn sm danger" onclick="del('${type}','${x.id}')">✕</button></td></tr>`).join('')}</table>`:`<div class="empty">Aucun élément dans <b>${esc(pname())}</b>.<br><button class="btn primary" onclick="${fn}()">＋ Ajouter le premier</button></div>`}</div></div>`;
}
function activeProjectBar(){
  return `<div class="card" style="background:#111827;color:#fff">
    <div class="section-title"><div><b>CHANTIER ACTIF</b><div style="font-size:19px;margin-top:4px">${esc(pname())}</div></div>
    <button class="btn" onclick="go('chantiers')">Changer</button></div>
    <select onchange="setProject(this.value)" style="background:#fff;color:#111827">${pselect()}</select>
  </div>`;
}
function addWorker(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('👷 Ouvrier',`<div class="formgrid">${pf()}<label>Nom<input id="name"></label><label>Fonction<input id="role" placeholder="Maçon"></label><label>Téléphone<input id="phone"></label><label>Salaire / jour DH<input id="rate" type="number"></label><label>Heures prévues / semaine<input id="hours" type="number"></label></div><button class="btn primary" onclick="saveObj('workers',{name:'name',role:'role',phone:'phone',rate:'rate',hours:'hours'})">Enregistrer</button>`)}
function addAttendance(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('🕘 Heures de travail',`<div class="formgrid">${pf()}<label>Date<input id="date" type="date" value="${today()}"></label><label>Ouvrier<select id="worker">${db.workers.filter(filt).map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></label><label>Heures<input id="hours" type="number" step=".5"></label><label>Heures supplémentaires<input id="extra" type="number" step=".5"></label><label>Transport DH<input id="transport" type="number"></label></div><button class="btn primary" onclick="saveObj('attendance',{date:'date',workerId:'worker',hours:'hours',extra:'extra',transport:'transport'})">Enregistrer</button>`)}
function addAdvance(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('💶 Avance ou acompte ouvrier',`<div class="formgrid">${pf()}<label>Date<input id="date" type="date" value="${today()}"></label><label>Ouvrier<select id="worker">${db.workers.filter(filt).map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></label><label>Montant DH<input id="amount" type="number"></label><label>Motif<input id="note"></label></div><button class="btn primary" onclick="saveObj('advances',{date:'date',workerId:'worker',amount:'amount',note:'note'})">Enregistrer</button>`)}
function addMaterial(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('🧱 Matériel / matériau',`<div class="formgrid">${pf()}<label>Désignation<input id="name" placeholder="Ciment, acier..."></label><label>Unité<input id="unit" placeholder="sac, kg, m³"></label><label>Quantité<input id="qty" type="number" step=".01"></label><label>Prix unitaire DH<input id="price" type="number" step=".01"></label><label>Fournisseur<input id="supplier"></label></div><button class="btn primary" onclick="saveMaterial()">Enregistrer</button>`)}
function saveMaterial(){
  if(!currentProject){alert('Sélectionnez d’abord un chantier.');return;}
  const q=Number(document.getElementById('qty').value)||0,p=Number(document.getElementById('price').value)||0;
  db.materials.push({id:id(),projectId:currentProject,name:document.getElementById('name').value,unit:document.getElementById('unit').value,qty:q,price:p,total:q*p,supplier:document.getElementById('supplier').value});
  closeModal();save();
}
  let q=Number(document.getElementById('qty').value)||0,p=Number(document.getElementById('price').value)||0;
  db.materials.push({id:id(),projectId,name:document.getElementById('name').value,unit:document.getElementById('unit').value,qty:q,price:p,total:q*p,supplier:document.getElementById('supplier').value});
  closeModal();save();
}
function addMeter(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('📏 Métré',`<div class="formgrid">${pf()}<label>Date<input id="date" type="date" value="${today()}"></label><label>Désignation<input id="name"></label><label>Unité<input id="unit" placeholder="m² / m³ / ml"></label><label>Quantité<input id="qty" type="number" step=".01"></label><label>Prix unitaire DH<input id="price" type="number" step=".01"></label></div><button class="btn primary" onclick="saveMeter()">Enregistrer</button>`)}
function saveMeter(){
  if(!currentProject){alert('Sélectionnez d’abord un chantier.');return;}
  const q=Number(document.getElementById('qty').value)||0,p=Number(document.getElementById('price').value)||0;
  db.meters.push({id:id(),projectId:currentProject,date:document.getElementById('date').value,name:document.getElementById('name').value,unit:document.getElementById('unit').value,qty:q,price:p,total:q*p});
  closeModal();save();
}
  let q=Number(document.getElementById('qty').value)||0,p=Number(document.getElementById('price').value)||0;
  db.meters.push({id:id(),projectId,date:document.getElementById('date').value,name:document.getElementById('name').value,unit:document.getElementById('unit').value,qty:q,price:p,total:q*p});
  closeModal();save();
}
function addExpense(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('💸 Dépense chantier',`<div class="formgrid">${pf()}<label>Date<input id="date" type="date" value="${today()}"></label><label>Catégorie<input id="cat" placeholder="Transport, main d'œuvre..."></label><label class="full">Description<input id="desc"></label><label>Montant DH<input id="amount" type="number"></label></div><button class="btn primary" onclick="saveObj('expenses',{date:'date',category:'cat',description:'desc',amount:'amount'})">Enregistrer</button>`)}
function addPayment(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('💵 Recette / encaissement',`<div class="formgrid">${pf()}<label>Date<input id="date" type="date" value="${today()}"></label><label>Client<input id="client"></label><label>Référence<input id="ref"></label><label>Montant DH<input id="amount" type="number"></label><label>Mode<select id="method"><option>Virement</option><option>Chèque</option><option>Espèces</option></select></label></div><button class="btn primary" onclick="saveObj('payments',{date:'date',client:'client',ref:'ref',amount:'amount',method:'method'})">Enregistrer</button>`)}
function addInvoice(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('🧾 Facturation',`<div class="formgrid">${pf()}<label>N° facture<input id="number"></label><label>Date<input id="date" type="date" value="${today()}"></label><label>Objet<input id="subject"></label><label>Montant HT DH<input id="ht" type="number"></label><label>TVA %<input id="tva" type="number" value="20"></label><label>Statut<select id="status"><option>Brouillon</option><option>Envoyée</option><option>Payée</option></select></label></div><button class="btn primary" onclick="saveInvoice()">Enregistrer</button>`)}
function saveInvoice(){let h=+document.getElementById('ht').value||0,t=+document.getElementById('tva').value||0;db.invoices.push({id:id(),projectId:document.getElementById('fproject').value,number:document.getElementById('number').value,date:document.getElementById('date').value,subject:document.getElementById('subject').value,ht:h,tva:t,ttc:h*(1+t/100),status:document.getElementById('status').value});closeModal();save()}
function addTask(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('📅 Tâche / planning',`<div class="formgrid">${pf()}<label>Tâche<input id="name"></label><label>Responsable<input id="owner"></label><label>Date début<input id="start" type="date"></label><label>Date fin<input id="end" type="date"></label><label>Statut<select id="status"><option>À faire</option><option>En cours</option><option>Terminé</option></select></label><label>% avancement<input id="progress" type="number" min="0" max="100" value="0"></label></div><button class="btn primary" onclick="saveObj('tasks',{name:'name',owner:'owner',start:'start',end:'end',status:'status',progress:'progress'})">Enregistrer</button>`)}
function addMeeting(){if(!currentProject){alert('Sélectionnez d’abord un chantier.');go('chantiers');return;}if(!requireProject())return;modal('🤝 Réunion',`<div class="formgrid">${pf()}<label>Date<input id="date" type="date"></label><label>Objet<input id="subject"></label><label>Participants<input id="people"></label><label class="full">Compte rendu<textarea id="report"></textarea></label></div><button class="btn primary" onclick="saveObj('meetings',{date:'date',subject:'subject',people:'people',report:'report'})">Enregistrer</button>`)}
function saveObj(type,map){
  let x={id:id()};
  Object.entries(map).forEach(([k,v])=>{
    const el=document.getElementById(v);
    x[k]=el ? el.value : '';
  });
  const fp=document.getElementById('fproject');
  x.projectId=(fp && fp.value) ? fp.value : currentProject;
  if(!x.projectId){alert('Choisissez d’abord un chantier.');return;}
  ['amount','rate','hours','extra','transport','progress'].forEach(k=>{if(k in x)x[k]=Number(x[k])||0});
  db[type].push(x);
  closeModal();save();
}
function gantt(){let tasks=db.tasks.filter(filt);if(!tasks.length)return '<div class="card empty">Aucune tâche. Ajoutez des tâches pour construire le Gantt.</div>';let dates=tasks.flatMap(t=>[t.start,t.end]).filter(Boolean).sort();let min=dates[0]||today(),max=dates[dates.length-1]||today();let a=new Date(min),b=new Date(max),days=Math.max(1,Math.ceil((b-a)/86400000)+1);return `<div class="card"><h3>📊 Diagramme de Gantt</h3><div class="gantt">${tasks.map(t=>{let s=new Date(t.start||min),e=new Date(t.end||t.start||max);let left=Math.max(0,(s-a)/86400000/days*100),width=Math.max(2,((e-s)/86400000+1)/days*100);return `<div class="gantt-row"><div class="gantt-name">${esc(t.name)}</div><div class="gantt-track"><div class="bar" style="left:${left}%;width:${width}%">${esc(t.status||'')}</div></div></div>`}).join('')}</div></div>`}
const views={
dashboard(){let income=sum('payments',filt),exp=sum('expenses',filt),budget=pid()?(db.projects.find(p=>p.id===pid())?.budget||0):sum('projects');return `<div class="section-title"><div><h2>📊 Tableau de bord</h2><span class="muted">${pid()?pname():'Tous les chantiers'}</span></div><button class="btn primary" onclick="addProject()">＋ Nouveau chantier</button></div><div class="grid"><div class="card stat"><span class="muted">Chantiers</span><div class="v">${db.projects.length}</div></div><div class="card stat"><span class="muted">Budget</span><div class="v">${money(budget)}</div></div><div class="card stat"><span class="muted">Recettes</span><div class="v">${money(income)}</div></div><div class="card stat"><span class="muted">Dépenses</span><div class="v">${money(exp)}</div></div></div><div class="card"><h3>Mes chantiers</h3>${db.projects.length?db.projects.map(projectCard).join(''):'<div class="empty">Créez votre premier chantier.</div>'}</div>`},
chantiers(){return `<div class="section-title"><h2>🏗️ Mes chantiers</h2><button class="btn primary" onclick="addProject()">＋ Nouveau chantier</button></div>${db.projects.length?db.projects.map(projectCard).join(''):'<div class="card empty">Aucun chantier.</div>'}`},
project(){let p=db.projects.find(x=>x.id===pid());if(!p)return `<div class="card empty">Sélectionnez un chantier depuis Mes chantiers.</div>`;let inc=sum('payments',x=>x.projectId===p.id),exp=sum('expenses',x=>x.projectId===p.id),mat=sum('materials',x=>x.projectId===p.id,'total'),fact=sum('invoices',x=>x.projectId===p.id,'ttc'),workers=db.workers.filter(x=>x.projectId===p.id).length;return `<div class="section-title"><div><h2>🏗️ ${esc(p.name)}</h2><span class="muted">${esc(p.client||'')} · ${esc(p.address||'')}</span></div><button class="btn" onclick="go('chantiers')">← Mes chantiers</button></div><div class="grid"><div class="card stat"><span>Budget</span><div class="v">${money(p.budget)}</div></div><div class="card stat"><span>Facturé</span><div class="v">${money(fact)}</div></div><div class="card stat"><span>Encaissé</span><div class="v">${money(inc)}</div></div><div class="card stat"><span>Dépensé</span><div class="v">${money(exp+mat)}</div></div></div><div class="two"><div class="card"><h3>👷 Équipe</h3><p>${workers} ouvriers</p><button class="btn" onclick="go('ouvriers')">Gérer les ouvriers</button></div><div class="card"><h3>📅 Planning</h3><p>${db.tasks.filter(x=>x.projectId===p.id).length} tâches</p><button class="btn" onclick="go('planning')">Ouvrir le Gantt</button></div></div><div class="card"><h3>⚡ Gestion du chantier</h3><p class="muted">Chaque bouton ouvre les données propres à ce chantier. Les ajouts restent séparés des autres chantiers.</p><div class="toolbar"><button class="btn" onclick="go('attendance')">🕘 Heures</button><button class="btn" onclick="go('advances')">💶 Avances</button><button class="btn" onclick="go('materials')">🧱 Matériel</button><button class="btn" onclick="go('meters')">📏 Métrés</button><button class="btn" onclick="go('expenses')">💸 Dépenses</button><button class="btn" onclick="go('payments')">💵 Recettes</button><button class="btn" onclick="go('invoices')">🧾 Facturation</button><button class="btn" onclick="go('meetings')">🤝 Réunions</button></div></div>`},
ouvriers(){return simplePage('👷 Ouvriers','workers',['Nom','Fonction','Téléphone','Salaire/jour'],x=>[esc(x.name),esc(x.role),esc(x.phone),money(x.rate)],addWorker)},
attendance(){return simplePage('🕘 Heures de travail','attendance',['Date','Ouvrier','Heures','Sup.','Transport'],x=>[x.date,esc(db.workers.find(w=>w.id===x.workerId)?.name||'—'),x.hours,x.extra,money(x.transport)],addAttendance)},
advances(){return simplePage('💶 Avances ouvriers','advances',['Date','Ouvrier','Montant','Motif'],x=>[x.date,esc(db.workers.find(w=>w.id===x.workerId)?.name||'—'),money(x.amount),esc(x.note)],addAdvance)},
materials(){return simplePage('🧱 Matériel / matériaux','materials',['Désignation','Unité','Qté','Prix','Total'],x=>[esc(x.name),esc(x.unit),x.qty,money(x.price),money(x.total)],addMaterial)},
meters(){return simplePage('📏 Métrés','meters',['Date','Désignation','Unité','Qté','Total'],x=>[x.date,esc(x.name),esc(x.unit),x.qty,money(x.total)],addMeter)},
expenses(){return simplePage('💸 Dépenses','expenses',['Date','Catégorie','Description','Montant'],x=>[x.date,esc(x.category),esc(x.description),money(x.amount)],addExpense)},
payments(){return simplePage('💵 Recettes / encaissements','payments',['Date','Client','Référence','Montant','Mode'],x=>[x.date,esc(x.client),esc(x.ref),money(x.amount),esc(x.method)],addPayment)},
invoices(){return simplePage('🧾 Facturation','invoices',['N°','Date','Objet','HT','TTC','Statut'],x=>[esc(x.number),x.date,esc(x.subject),money(x.ht),money(x.ttc),`<span class="badge">${esc(x.status)}</span>`],addInvoice)},
planning(){
  if(!pid()) return `<div class="card empty"><h2>📅 Planning</h2><p>Sélectionnez d’abord un chantier.</p><button class="btn primary" onclick="go('chantiers')">🏗️ Choisir un chantier</button></div>`;
  return `${activeProjectBar()}
  <div class="section-title"><div><h2>📅 Planning + Gantt</h2><span class="muted">${esc(pname())}</span></div><button class="btn primary" onclick="addTask()">＋ Tâche</button></div>
  ${gantt()}
  ${simplePage('Liste des tâches','tasks',['Tâche','Responsable','Début','Fin','Statut'],x=>[esc(x.name),esc(x.owner),x.start,x.end,esc(x.status)],addTask)}`;
},
meetings(){return simplePage('🤝 Réunions','meetings',['Date','Objet','Participants','Compte rendu'],x=>[x.date,esc(x.subject),esc(x.people),esc(x.report)],addMeeting)},
documents(){return `<div class="card"><h2>📄 Documents</h2><p class="muted">Espace documents du chantier à compléter.</p></div>`},
photos(){return `<div class="card"><h2>📸 Photos</h2><p class="muted">Espace photos du chantier à compléter.</p></div>`},
finances(){let r=sum('payments',filt),e=sum('expenses',filt),m=sum('materials',filt,'total'),a=sum('advances',filt);return `<div class="section-title"><h2>📊 Tableau financier</h2></div><div class="grid"><div class="card stat"><span>Recettes</span><div class="v">${money(r)}</div></div><div class="card stat"><span>Dépenses</span><div class="v">${money(e)}</div></div><div class="card stat"><span>Matériel</span><div class="v">${money(m)}</div></div><div class="card stat"><span>Avances ouvriers</span><div class="v">${money(a)}</div></div></div><div class="card"><h3>Solde chantier</h3><div style="font-size:30px;font-weight:900" class="${r-e-m-a>=0?'success':'dangertext'}">${money(r-e-m-a)}</div></div>`},
plus(){return `<div class="card"><h2>⚙️ Outils</h2><button class="btn primary" onclick="exportData()">💾 Exporter sauvegarde</button><input type="file" accept=".json" onchange="importData(event)" style="margin-top:10px"><p>Safari → Partager → Ajouter à l'écran d'accueil.</p></div>`}
};
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Spids_Manager_backup.json';a.click()}
function importData(e){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Sauvegarde restaurée')}catch(x){alert('Fichier invalide')}};r.readAsText(e.target.files[0])}
render();
</script>
</body>
</html>
