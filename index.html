<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spids Manager</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}
header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;color:#cbd5e1}

.container{
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
.card h3{margin:0 0 10px}
.card .number{
  font-size:28px;
  font-weight:bold;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:hover{opacity:.9}

.section{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
}

.hidden{display:none}

.item{
  padding:12px;
  border-bottom:1px solid #eee;
}

.delete{
  background:#dc2626;
  padding:8px 12px;
  font-size:13px;
}

@media(max-width:600px){
  .container{padding:12px}
  header h1{font-size:24px}
}
</style>
</head>

<body>

<header>
  <h1>Spids Manager</h1>
  <p>Gestion complète des chantiers</p>
</header>

<div class="container">

  <div class="dashboard">

    <div class="card">
      <h3>Chantiers</h3>
      <div class="number" id="chantierCount">0</div>
    </div>

    <div class="card">
      <h3>Ouvriers</h3>
      <div class="number" id="workerCount">0</div>
    </div>

    <div class="card">
      <h3>Dépenses</h3>
      <div class="number" id="expenseTotal">0 DH</div>
    </div>

    <div class="card">
      <h3>Recettes</h3>
      <div class="number" id="incomeTotal">0 DH</div>
    </div>

  </div>

  <div class="menu">

    <button onclick="showSection('chantiers')">
      🏗️ Chantiers
    </button>

    <button onclick="showSection('ouvriers')">
      👷 Ouvriers
    </button>

    <button onclick="showSection('depenses')">
      💰 Dépenses
    </button>

    <button onclick="showSection('recettes')">
      💵 Recettes
    </button>

    <button onclick="showSection('factures')">
      🧾 Factures
    </button>

    <button onclick="showSection('reunions')">
      📅 Réunions
    </button>

    <button onclick="showSection('materiaux')">
      🧱 Matériaux
    </button>

    <button onclick="showSection('personnel')">
      👤 Personnel
    </button>

  </div>


  <!-- CHANTIERS -->

  <div id="chantiers" class="section hidden">

    <h2>🏗️ Gestion des chantiers</h2>

    <input id="chantierName" placeholder="Nom du chantier">

    <input id="chantierClient" placeholder="Nom du client">

    <input id="chantierVille" placeholder="Ville">

    <button onclick="addChantier()">Ajouter le chantier</button>

    <div id="chantierList"></div>

  </div>


  <!-- OUVRIERS -->

  <div id="ouvriers" class="section hidden">

    <h2>👷 Ouvriers</h2>

    <input id="workerName" placeholder="Nom de l'ouvrier">

    <input id="workerJob" placeholder="Métier">

    <input id="workerSalary" type="number" placeholder="Salaire / jour">

    <button onclick="addWorker()">Ajouter l'ouvrier</button>

    <div id="workerList"></div>

  </div>


  <!-- DEPENSES -->

  <div id="depenses" class="section hidden">

    <h2>💰 Dépenses</h2>

    <input id="expenseName" placeholder="Description">

    <input id="expenseAmount" type="number" placeholder="Montant DH">

    <button onclick="addExpense()">Ajouter la dépense</button>

    <div id="expenseList"></div>

  </div>


  <!-- RECETTES -->

  <div id="recettes" class="section hidden">

    <h2>💵 Recettes</h2>

    <input id="incomeName" placeholder="Description">

    <input id="incomeAmount" type="number" placeholder="Montant DH">

    <button onclick="addIncome()">Ajouter la recette</button>

    <div id="incomeList"></div>

  </div>


  <!-- FACTURES -->

  <div id="factures" class="section hidden">

    <h2>🧾 Factures</h2>

    <input id="invoiceName" placeholder="Client / fournisseur">

    <input id="invoiceAmount" type="number" placeholder="Montant DH">

    <button onclick="addInvoice()">Ajouter la facture</button>

    <div id="invoiceList"></div>

  </div>


  <!-- REUNIONS -->

  <div id="reunions" class="section hidden">

    <h2>📅 Réunions</h2>

    <input id="meetingName" placeholder="Objet de la réunion">

    <input id="meetingDate" type="date">

    <button onclick="addMeeting()">Ajouter la réunion</button>

    <div id="meetingList"></div>

  </div>


  <!-- MATERIAUX -->

  <div id="materiaux" class="section hidden">

    <h2>🧱 Matériaux</h2>

    <input id="materialName" placeholder="Nom du matériau">

    <input id="materialQty" type="number" placeholder="Quantité">

    <input id="materialPrice" type="number" placeholder="Prix DH">

    <button onclick="addMaterial()">Ajouter le matériau</button>

    <div id="materialList"></div>

  </div>


  <!-- PERSONNEL -->

  <div id="personnel" class="section hidden">

    <h2>👤 Personnel</h2>

    <p>
      Espace de gestion du personnel et des intervenants.
    </p>

  </div>

</div>


<script>

let chantiers =
JSON.parse(localStorage.getItem("chantiers") || "[]");

let workers =
JSON.parse(localStorage.getItem("workers") || "[]");

let expenses =
JSON.parse(localStorage.getItem("expenses") || "[]");

let incomes =
JSON.parse(localStorage.getItem("incomes") || "[]");

let invoices =
JSON.parse(localStorage.getItem("invoices") || "[]");

let meetings =
JSON.parse(localStorage.getItem("meetings") || "[]");

let materials =
JSON.parse(localStorage.getItem("materials") || "[]");


function save(){

localStorage.setItem("chantiers",JSON.stringify(chantiers));
localStorage.setItem("workers",JSON.stringify(workers));
localStorage.setItem("expenses",JSON.stringify(expenses));
localStorage.setItem("incomes",JSON.stringify(incomes));
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("meetings",JSON.stringify(meetings));
localStorage.setItem("materials",JSON.stringify(materials));

updateDashboard();

}


function showSection(id){

document.querySelectorAll(".section")
.forEach(x=>x.classList.add("hidden"));

document.getElementById(id)
.classList.remove("hidden");

}


function addChantier(){

let name=document.getElementById("chantierName").value;
let client=document.getElementById("chantierClient").value;
let ville=document.getElementById("chantierVille").value;

if(!name)return;

chantiers.push({
name:name,
client:client,
ville:ville
});

save();
render();

document.getElementById("chantierName").value="";
document.getElementById("chantierClient").value="";
document.getElementById("chantierVille").value="";

}


function addWorker(){

let name=document.getElementById("workerName").value;
let job=document.getElementById("workerJob").value;
let salary=document.getElementById("workerSalary").value;

if(!name)return;

workers.push({
name:name,
job:job,
salary:Number(salary)
});

save();
render();

}


function addExpense(){

let name=document.getElementById("expenseName").value;
let amount=document.getElementById("expenseAmount").value;

if(!name)return;

expenses.push({
name:name,
amount:Number(amount)
});

save();
render();

}


function addIncome(){

let name=document.getElementById("incomeName").value;
let amount=document.getElementById("incomeAmount").value;

if(!name)return;

incomes.push({
name:name,
amount:Number(amount)
});

save();
render();

}


function addInvoice(){

let name=document.getElementById("invoiceName").value;
let amount=document.getElementById("invoiceAmount").value;

if(!name)return;

invoices.push({
name:name,
amount:Number(amount)
});

save();
render();

}


function addMeeting(){

let name=document.getElementById("meetingName").value;
let date=document.getElementById("meetingDate").value;

if(!name)return;

meetings.push({
name:name,
date:date
});

save();
render();

}


function addMaterial(){

let name=document.getElementById("materialName").value;
let qty=document.getElementById("materialQty").value;
let price=document.getElementById("materialPrice").value;

if(!name)return;

materials.push({
name:name,
qty:Number(qty),
price:Number(price)
});

save();
render();

}


function removeItem(type,index){

if(type==="chantier")chantiers.splice(index,1);
if(type==="worker")workers.splice(index,1);
if(type==="expense")expenses.splice(index,1);
if(type==="income")incomes.splice(index,1);
if(type==="invoice")invoices.splice(index,1);
if(type==="meeting")meetings.splice(index,1);
if(type==="material")materials.splice(index,1);

save();
render();

}


function render(){

document.getElementById("chantierList").innerHTML =
chantiers.map((x,i)=>
`<div class="item">
<b>${x.name}</b><br>
Client: ${x.client}<br>
Ville: ${x.ville}
<br><button class="delete"
onclick="removeItem('chantier',${i})">
Supprimer
</button>
</div>`).join("");


document.getElementById("workerList").innerHTML =
workers.map((x,i)=>
`<div class="item">
<b>${x.name}</b> - ${x.job}<br>
${x.salary} DH / jour
<br><button class="delete"
onclick="removeItem('worker',${i})">
Supprimer
</button>
</div>`).join("");


document.getElementById("expenseList").innerHTML =
expenses.map((x,i)=>
`<div class="item">
${x.name} — <b>${x.amount} DH</b>
<br><button class="delete"
onclick="removeItem('expense',${i})">
Supprimer
</button>
</div>`).join("");


document.getElementById("incomeList").innerHTML =
incomes.map((x,i)=>
`<div class="item">
${x.name} — <b>${x.amount} DH</b>
<br><button class="delete"
onclick="removeItem('income',${i})">
Supprimer
</button>
</div>`).join("");


document.getElementById("invoiceList").innerHTML =
invoices.map((x,i)=>
`<div class="item">
${x.name} — <b>${x.amount} DH</b>
<br><button class="delete"
onclick="removeItem('invoice',${i})">
Supprimer
</button>
</div>`).join("");


document.getElementById("meetingList").innerHTML =
meetings.map((x,i)=>
`<div class="item">
${x.name} — ${x.date}
<br><button class="delete"
onclick="removeItem('meeting',${i})">
Supprimer
</button>
</div>`).join("");


document.getElementById("materialList").innerHTML =
materials.map((x,i)=>
`<div class="item">
${x.name} — ${x.qty} × ${x.price} DH
<br><button class="delete"
onclick="removeItem('material',${i})">
Supprimer
</button>
</div>`).join("");

}


function updateDashboard(){

document.getElementById("chantierCount")
.innerText=chantiers.length;

document.getElementById("workerCount")
.innerText=workers.length;

let exp=expenses.reduce((a,b)=>a+b.amount,0);

let inc=incomes.reduce((a,b)=>a+b.amount,0);

document.getElementById("expenseTotal")
.innerText=exp.toLocaleString()+" DH";

document.getElementById("incomeTotal")
.innerText=inc.toLocaleString()+" DH";

}


render();
updateDashboard();

</script>

</body>
</html>
