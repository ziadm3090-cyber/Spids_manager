<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spids Manager">
<title>Spids Manager</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212f;--muted:#6b7280;--line:#e5e7eb;--primary:#1f7a45;--primary2:#155d34;--danger:#c0392b;--blue:#2563eb;--shadow:0 6px 24px #0000000d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:#d9f24b;color:#111827;display:grid;place-items:center;font-weight:900;font-size:20px}.top h1{font-size:18px;margin:0}.top small{display:block;color:#cbd5e1;margin-top:2px}
.wrap{max-width:1250px;margin:auto;padding:14px 14px 90px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:10px 13px;background:#e5e7eb;color:#111827;font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn.dark{background:#1f2937;color:#fff}.btn.sm{padding:7px 9px;font-size:13px}
.nav{display:flex;gap:6px;overflow:auto;padding:5px 0 12px;position:sticky;top:65px;z-index:15;background:var(--bg)}
.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;color:#374151;font-weight:700}.nav button.active{background:#111827;color:#fff;border-color:#111827}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}.stat{min-height:105px}.stat .v{font-size:25px;font-weight:900;margin-top:8px}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:5px 0 12px}.section-title h2,.section-title h3{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-size:13px;font-weight:800;color:#374151;display:block;margin:8px 0 5px}input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff;color:#111827}textarea{min-height:85px;resize:vertical}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{color:#4b5563;background:#f9fafb;position:sticky;top:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#eef2ff;color:#3730a3}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}
.empty{text-align:center;padding:28px;color:var(--muted)}.project{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.project h3{margin:0 0 5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mini{background:#f8fafc;border-radius:10px;padding:9px}.mini b{display:block;margin-top:3px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:30}.bottom button{border:0;background:transparent;color:#4b5563;font-weight:800;font-size:11px}.bottom button span{display:block;font-size:20px;margin-bottom:2px}.hidden{display:none!important}.dangertext{color:var(--danger);font-weight:800}.success{color:#166534;font-weight:800}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.two,.formgrid{grid-template-columns:1fr}.nav{top:65px}}
@media(max-width:520px){.wrap{padding:10px 10px 88px}.grid{gap:8px}.stat{padding:11px;min-height:92px}.stat .v{font-size:20px}.card{padding:12px}.project{align-items:flex-start;flex-direction:column}.project .actions{width:100%;display:flex}.project .actions button{flex:1}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">S</div>
  <div><h1>Spids Manager</h1><small id="topSubtitle">Gestion complète des chantiers</small></div>
  <div style="margin-left:auto"><button class="btn sm dark" onclick="exportData()">⬇ Sauvegarde</button></div>
</header>
<div class="wrap">
  <div class="nav" id="nav"></div>
  <main id="view"></main>
</div>
<div class="bottom">
  <button onclick="go('dashboard')"><span>⌂</span>Accueil</button>
  <button onclick="go('chantiers')"><span>🏗️</span>Chantiers</button>
  <button onclick="go('ouvriers')"><span>👷</span>Ouvriers</button>
  <button onclick="go('finances')"><span>💰</span>Finances</button>
  <button onclick="go('plus')"><span>☰</span>Plus</button>
</div>
</div>

<script>
const KEY='spids_manager_v7';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 projects:[],workers:[],expenses:[],materials:[],suppliers:[],invoices:[],payments:[],
 documents:[],meetings:[],samples:[],photos:[],tasks:[],settings:{company:'Spids Manager',currency:'DH'}
};
let currentProject=localStorage.getItem('spids_current')||'';
let page='dashboard';

const navItems=[
 ['dashboard','🏠 Accueil'],['chantiers','🏗️ Chantiers'],['ouvriers','👷 Ouvriers'],['materials','🧱 Matériaux'],
 ['expenses','💸 Charges'],['suppliers','🚚 Fournisseurs'],['invoices','🧾 Factures'],['payments','💵 Encaissements'],
 ['documents','📄 Documents'],['meetings','🤝 Réunions'],['samples','🧪 Échantillons'],['photos','📸 Photos'],
 ['planning','📅 Planning'],['finances','📊 Finances']
];

function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' DH'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pid(){return currentProject}
function pname(id=pid()){return db.projects.find(p=>p.id===id)?.name||'Tous les chantiers'}
function projectSelect(selected='',all=false){
 let x=all?'<option value="">Tous les chantiers</option>':'<option value="">Choisir un chantier</option>';
 return x+db.projects.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')
}
function go(p){page=p;render();window.scrollTo(0,0)}
function setProject(id){currentProject=id;localStorage.setItem('spids_current',id);go('project')}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}
function render(){renderNav();document.getElementById('topSubtitle').textContent=currentProject?`Chantier: ${pname()}`:'Gestion complète des chantiers';let v=document.getElementById('view');v.innerHTML=views[page]?views[page]():views.dashboard();}

function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#0008;z-index:100;padding:18px;overflow:auto"><div class="card" style="max-width:760px;margin:40px auto"><div class="section-title"><h2>${title}</h2><button class="btn sm" onclick="document.getElementById('modal').remove()">✕</button></div>${body}</div></div>`)}

function addProject(){modal('Nouveau chantier',`<div class="formgrid">
<label>Nom du chantier<input id="pname" placeholder="Ex: Villa Bouskoura"></label>
<label>Client<input id="pclient" placeholder="Nom du client"></label>
<label>Budget prévu (DH)<input id="pbudget" type="number"></label>
<label>Adresse<input id="paddr" placeholder="Adresse du chantier"></label>
<label>Date début<input id="pstart" type="date"></label>
<label>Date fin prévue<input id="pend" type="date"></label>
<label class="full">Notes<textarea id="pnotes"></textarea></label></div><button class="btn primary" onclick="saveProject()">Créer le chantier</button>`)}
function saveProject(){let p={id:uid(),name:document.getElementById('pname').value.trim()||'Nouveau chantier',client:document.getElementById('pclient').value,budget:+document.getElementById('pbudget').value||0,address:document.getElementById('paddr').value,start:document.getElementById('pstart').value,end:document.getElementById('pend').value,notes:document.getElementById('pnotes').value};db.projects.push(p);currentProject=p.id;localStorage.setItem('spids_current',p.id);document.getElementById('modal').remove();save();go('project')}

function del(type,id){if(confirm('Supprimer cet élément ?')){db[type]=db[type].filter(x=>x.id!==id);save()}}
function sum(type,filter=()=>true,field='amount'){return db[type].filter(filter).reduce((a,x)=>a+(+x[field]||0),0)}
function projectFilter(x){return !pid()||x.projectId===pid()}

const views={
dashboard(){let income=sum('payments',projectFilter),expense=sum('expenses',projectFilter),workers=db.workers.filter(x=>projectFilter(x)).length,mat=sum('materials',projectFilter,'total'),budget=pid()?(db.projects.find(x=>x.id===pid())?.budget||0):sum('projects',()=>true,'budget');return `<div class="section-title"><div><h2>Tableau de bord</h2><span class="muted">${pid()?esc(pname()):'Vue générale de tous les chantiers'}</span></div><button class="btn primary" onclick="addProject()">＋ Nouveau chantier</button></div>
<div class="grid">
<div class="card stat"><span class="muted">Chantiers</span><div class="v">${db.projects.length}</div></div>
<div class="card stat"><span class="muted">Ouvriers</span><div class="v">${workers}</div></div>
<div class="card stat"><span class="muted">Encaissements</span><div class="v">${money(income)}</div></div>
<div class="card stat"><span class="muted">Charges</span><div class="v">${money(expense)}</div></div>
</div>
<div class="two"><div class="card"><div class="section-title"><h3>Résultat</h3></div><div class="kpis"><div class="mini">Matériaux<b>${money(mat)}</b></div><div class="mini">Dépenses<b>${money(expense)}</b></div><div class="mini">Solde<b class="${income-expense>=0?'success':'dangertext'}">${money(income-expense)}</b></div></div></div>
<div class="card"><div class="section-title"><h3>Accès rapide</h3></div><div class="toolbar"><button class="btn" onclick="go('workers')">👷 Ouvriers</button><button class="btn" onclick="go('materials')">🧱 Matériaux</button><button class="btn" onclick="go('expenses')">💸 Charges</button><button class="btn" onclick="go('payments')">💵 Encaissement</button></div></div></div>
<div class="card"><div class="section-title"><h3>Derniers chantiers</h3><button class="btn sm primary" onclick="addProject()">＋ Ajouter</button></div>${db.projects.length?db.projects.slice(-5).reverse().map(p=>projectCard(p)).join(''):'<div class="empty">Aucun chantier. Créez le premier.</div>'}</div>`},
chantiers(){return `<div class="section-title"><h2>🏗️ Chantiers</h2><button class="btn primary" onclick="addProject()">＋ Nouveau chantier</button></div>${db.projects.length?db.projects.map(projectCard).join(''):'<div class="card empty">Aucun chantier.</div>'}`},
project(){let p=db.projects.find(x=>x.id===pid());if(!p)return views.chantiers();let e=sum('expenses',x=>x.projectId===p.id),inc=sum('payments',x=>x.projectId===p.id),w=db.workers.filter(x=>x.projectId===p.id).length,m=db.materials.filter(x=>x.projectId===p.id).length;return `<div class="section-title"><div><h2>🏗️ ${esc(p.name)}</h2><span class="muted">${esc(p.client||'Sans client')} • ${esc(p.address||'')}</span></div><button class="btn" onclick="go('chantiers')">← Chantiers</button></div>
<div class="grid"><div class="card stat"><span class="muted">Budget</span><div class="v">${money(p.budget)}</div></div><div class="card stat"><span class="muted">Encaissements</span><div class="v">${money(inc)}</div></div><div class="card stat"><span class="muted">Dépenses</span><div class="v">${money(e)}</div></div><div class="card stat"><span class="muted">Solde</span><div class="v">${money(inc-e)}</div></div></div>
<div class="grid"><div class="card"><h3>👷 Ouvriers</h3><b>${w}</b><br><button class="btn sm" onclick="go('ouvriers')">Gérer</button></div><div class="card"><h3>🧱 Matériaux</h3><b>${m}</b><br><button class="btn sm" onclick="go('materials')">Gérer</button></div><div class="card"><h3>💸 Charges</h3><b>${money(e)}</b><br><button class="btn sm" onclick="go('expenses')">Gérer</button></div><div class="card"><h3>📅 Planning</h3><button class="btn sm" onclick="go('planning')">Ouvrir</button></div></div>
<div class="card"><h3>Informations</h3><p><b>Début:</b> ${p.start||'—'} &nbsp; <b>Fin prévue:</b> ${p.end||'—'}</p><p>${esc(p.notes||'')}</p></div>`},
ouvriers(){return entityPage('👷 Ouvriers','workers',['Nom','Fonction','Téléphone','Salaire/jour','Présence'],x=>[esc(x.name),esc(x.role),esc(x.phone),money(x.rate),esc(x.presence||'')],()=>addWorker())},
materials(){return entityPage('🧱 Matériaux','materials',['Matériau','Unité','Quantité','Prix unitaire','Total'],x=>[esc(x.name),esc(x.unit),x.qty, money(x.price),money(x.total)],()=>addMaterial())},
expenses(){return entityPage('💸 Charges / Dépenses','expenses',['Date','Catégorie','Description','Montant'],x=>[esc(x.date),esc(x.category),esc(x.description),money(x.amount)],()=>addExpense())},
suppliers(){return entityPage('🚚 Fournisseurs','suppliers',['Nom','Contact','Téléphone','Spécialité'],x=>[esc(x.name),esc(x.contact),esc(x.phone),esc(x.specialty)],()=>addSupplier())},
invoices(){return entityPage('🧾 Factures','invoices',['N°','Fournisseur/Client','Date','Montant','Statut'],x=>[esc(x.number),esc(x.party),esc(x.date),money(x.amount),`<span class="badge ${x.status==='Payée'?'ok':'warn'}">${esc(x.status)}</span>`],()=>addInvoice())},
payments(){return entityPage('💵 Encaissements client','payments',['Date','Client','Référence','Montant','Mode'],x=>[esc(x.date),esc(x.client),esc(x.reference),money(x.amount),esc(x.method)],()=>addPayment())},
documents(){return entityPage('📄 Documents','documents',['Nom','Type','Date','Lien / note'],x=>[esc(x.name),esc(x.type),esc(x.date),esc(x.note)],()=>addDocument())},
meetings(){return entityPage('🤝 Réunions','meetings',['Date','Objet','Participants','Compte rendu'],x=>[esc(x.date),esc(x.subject),esc(x.people),esc(x.report)],()=>addMeeting())},
samples(){return entityPage('🧪 Échantillons','samples',['Référence','Matériau','Fournisseur','Statut','Note'],x=>[esc(x.ref),esc(x.material),esc(x.supplier),esc(x.status),esc(x.note)],()=>addSample())},
photos(){return photoPage()},
planning(){return entityPage('📅 Planning / tâches','tasks',['Début','Fin','Tâche','Responsable','Statut'],x=>[esc(x.start),esc(x.end),esc(x.task),esc(x.owner),`<span class="badge ${x.status==='Terminé'?'ok':'warn'}">${esc(x.status)}</span>`],()=>addTask())},
finances(){let income=sum('payments',projectFilter),exp=sum('expenses',projectFilter),mat=sum('materials',projectFilter,'total'),budget=pid()?(db.projects.find(p=>p.id===pid())?.budget||0):sum('projects',()=>true,'budget');return `<div class="section-title"><h2>📊 Finances</h2></div><div class="grid"><div class="card stat"><span class="muted">Budget</span><div class="v">${money(budget)}</div></div><div class="card stat"><span class="muted">Encaissements</span><div class="v">${money(income)}</div></div><div class="card stat"><span class="muted">Charges</span><div class="v">${money(exp)}</div></div><div class="card stat"><span class="muted">Marge cash</span><div class="v">${money(income-exp)}</div></div></div><div class="card"><h3>Répartition des coûts</h3><p>Matériaux: <b>${money(mat)}</b></p><p>Autres charges: <b>${money(exp)}</b></p><p>Coût total suivi: <b>${money(mat+exp)}</b></p></div>`},
plus(){return `<div class="section-title"><h2>⚙️ Outils</h2></div><div class="grid"><div class="card"><h3>💾 Sauvegarde</h3><p class="muted">Exportez toutes les données de Spids Manager.</p><button class="btn primary" onclick="exportData()">Exporter JSON</button></div><div class="card"><h3>📥 Restaurer</h3><p class="muted">Réimporter une sauvegarde.</p><input type="file" accept=".json" onchange="importData(event)"></div><div class="card"><h3>🧹 Réinitialiser</h3><p class="muted">Supprime toutes les données locales.</p><button class="btn danger" onclick="resetAll()">Réinitialiser</button></div><div class="card"><h3>📱 iPhone</h3><p>Safari → Partager → <b>Ajouter à l’écran d’accueil</b>.</p></div></div>`}
};

function projectCard(p){let e=sum('expenses',x=>x.projectId===p.id),i=sum('payments',x=>x.projectId===p.id);return `<div class="project"><div><h3>${esc(p.name)}</h3><span class="muted">${esc(p.client||'Sans client')} ${p.address?'• '+esc(p.address):''}</span><div class="kpis"><div class="mini">Budget<b>${money(p.budget)}</b></div><div class="mini">Dépenses<b>${money(e)}</b></div><div class="mini">Solde<b>${money(i-e)}</b></div></div></div><div class="actions"><button class="btn sm primary" onclick="setProject('${p.id}')">Ouvrir</button><button class="btn sm danger" onclick="delProject('${p.id}')">Supprimer</button></div></div>`}
function delProject(id){if(confirm('Supprimer le chantier et toutes ses données liées ?')){['workers','expenses','materials','invoices','payments','documents','meetings','samples','photos','tasks'].forEach(t=>db[t]=db[t].filter(x=>x.projectId!==id));db.projects=db.projects.filter(x=>x.id!==id);if(currentProject===id)currentProject='';save();go('chantiers')}}

function entityPage(title,type,cols,row,addFn){let list=db[type].filter(projectFilter);return `<div class="section-title"><div><h2>${title}</h2><span class="muted">${pid()?esc(pname()):'Tous les chantiers'}</span></div><button class="btn primary" onclick="${addFn.name}()">＋ Ajouter</button></div><div class="card"><div class="toolbar"><select onchange="filterProject(this.value)">${projectSelect(pid(),true)}</select></div><div class="tablewrap">${list.length?`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${list.map(x=>`<tr>${row(x).map(v=>`<td>${v}</td>`).join('')}<td><button class="btn sm danger" onclick="del('${type}','${x.id}')">✕</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucun élément pour ce chantier.</div>'}</div></div>`}
function filterProject(v){currentProject=v;localStorage.setItem('spids_current',v);render()}

function baseProjectField(){return `<label>Chantier<select id="fproject">${projectSelect(pid())}</select></label>`}
function addWorker(){modal('Ajouter un ouvrier',`<div class="formgrid">${baseProjectField()}<label>Nom<input id="fname"></label><label>Fonction<input id="frole" placeholder="Maçon, ferrailleur..."></label><label>Téléphone<input id="fphone"></label><label>Salaire / jour<input id="frate" type="number"></label><label>Présence<input id="fpresence" placeholder="Ex: 26 jours"></label><label class="full">Notes<textarea id="fnote"></textarea></label></div><button class="btn primary" onclick="saveSimple('workers',{name:'fname',role:'frole',phone:'fphone',rate:'frate',presence:'fpresence',note:'fnote'})">Enregistrer</button>`)}
function addMaterial(){modal('Ajouter un matériau',`<div class="formgrid">${baseProjectField()}<label>Matériau<input id="fname" placeholder="Ciment, acier..."></label><label>Unité<input id="funit" placeholder="kg, m³, sac..."></label><label>Quantité<input id="fqty" type="number" step="any"></label><label>Prix unitaire DH<input id="fprice" type="number" step="any"></label><label class="full>Fournisseur<input id="fsupplier"></label></div><button class="btn primary" onclick="saveMaterial()">Enregistrer</button>`)}
function saveMaterial(){let qty=+document.getElementById('fqty').value||0,price=+document.getElementById('fprice').value||0;db.materials.push({id:uid(),projectId:document.getElementById('fproject').value,name:document.getElementById('fname').value,unit:document.getElementById('funit').value,qty,price,total:qty*price,supplier:document.getElementById('fsupplier')?.value||''});document.getElementById('modal').remove();save()}
function addExpense(){modal('Ajouter une charge',`<div class="formgrid">${baseProjectField()}<label>Date<input id="fdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Catégorie<input id="fcat" placeholder="Main d'œuvre, transport..."></label><label class="full">Description<input id="fdesc"></label><label>Montant DH<input id="famount" type="number" step="any"></label><label>Référence<input id="fref"></label></div><button class="btn primary" onclick="saveSimple('expenses',{date:'fdate',category:'fcat',description:'fdesc',amount:'famount',reference:'fref'})">Enregistrer</button>`)}
function addSupplier(){modal('Ajouter un fournisseur',`<div class="formgrid"><label>Nom<input id="fname"></label><label>Contact<input id="fcontact"></label><label>Téléphone<input id="fphone"></label><label>Spécialité<input id="fspecialty"></label><label class="full">Notes<textarea id="fnote"></textarea></label></div><button class="btn primary" onclick="saveSimple('suppliers',{name:'fname',contact:'fcontact',phone:'fphone',specialty:'fspecialty',note:'fnote'})">Enregistrer</button>`)}
function addInvoice(){modal('Ajouter une facture',`<div class="formgrid">${baseProjectField()}<label>N° facture<input id="fnumber"></label><label>Fournisseur / Client<input id="fparty"></label><label>Date<input id="fdate" type="date"></label><label>Montant DH<input id="famount" type="number"></label><label>Statut<select id="fstatus"><option>À payer</option><option>Payée</option><option>Partielle</option></select></label></div><button class="btn primary" onclick="saveSimple('invoices',{number:'fnumber',party:'fparty',date:'fdate',amount:'famount',status:'fstatus'})">Enregistrer</button>`)}
function addPayment(){modal('Ajouter un encaissement',`<div class="formgrid">${baseProjectField()}<label>Date<input id="fdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Client<input id="fclient"></label><label>Référence<input id="fref"></label><label>Montant DH<input id="famount" type="number"></label><label>Mode<select id="fmethod"><option>Virement</option><option>Chèque</option><option>Espèces</option><option>Autre</option></select></label></div><button class="btn primary" onclick="saveSimple('payments',{date:'fdate',client:'fclient',reference:'fref',amount:'famount',method:'fmethod'})">Enregistrer</button>`)}
function addDocument(){modal('Ajouter un document',`<div class="formgrid">${baseProjectField()}<label>Nom<input id="fname" placeholder="Contrat, plan, devis..."></label><label>Type<input id="ftype"></label><label>Date<input id="fdate" type="date"></label><label class="full">Lien ou note<input id="fnote"></label></div><button class="btn primary" onclick="saveSimple('documents',{name:'fname',type:'ftype',date:'fdate',note:'fnote'})">Enregistrer</button>`)}
function addMeeting(){modal('Nouvelle réunion',`<div class="formgrid">${baseProjectField()}<label>Date<input id="fdate" type="date"></label><label>Objet<input id="fsubject"></label><label>Participants<input id="fpeople"></label><label class="full">Compte rendu<textarea id="freport"></textarea></label></div><button class="btn primary" onclick="saveSimple('meetings',{date:'fdate',subject:'fsubject',people:'fpeople',report:'freport'})">Enregistrer</button>`)}
function addSample(){modal('Nouvel échantillon',`<div class="formgrid">${baseProjectField()}<label>Référence<input id="fref"></label><label>Matériau<input id="fmaterial"></label><label>Fournisseur<input id="fsupplier"></label><label>Statut<select id="fstatus"><option>À valider</option><option>Validé</option><option>Refusé</option></select></label><label class="full">Note<textarea id="fnote"></textarea></label></div><button class="btn primary" onclick="saveSimple('samples',{ref:'fref',material:'fmaterial',supplier:'fsupplier',status:'fstatus',note:'fnote'})">Enregistrer</button>`)}
function addTask(){modal('Nouvelle tâche',`<div class="formgrid">${baseProjectField()}<label>Début<input id="fstart" type="date"></label><label>Fin<input id="fend" type="date"></label><label>Tâche<input id="ftask"></label><label>Responsable<input id="fowner"></label><label>Statut<select id="fstatus"><option>À faire</option><option>En cours</option><option>Terminé</option></select></label></div><button class="btn primary" onclick="saveSimple('tasks',{start:'fstart',end:'fend',task:'ftask',owner:'fowner',status:'fstatus'})">Enregistrer</button>`)}
function saveSimple(type,map){let x={id:uid()};Object.entries(map).forEach(([k,id])=>{let el=document.getElementById(id);x[k]=el?el.value:''});if(['expenses','invoices','payments'].includes(type))x.amount=+x.amount||0;if(document.getElementById('fproject'))x.projectId=document.getElementById('fproject').value;else if(['expenses','invoices','payments','workers','documents','meetings','samples','tasks'].includes(type))x.projectId=pid();db[type].push(x);document.getElementById('modal').remove();save()}

function photoPage(){let list=db.photos.filter(projectFilter);return `<div class="section-title"><div><h2>📸 Photos / suivi</h2><span class="muted">Ajoutez les photos du chantier depuis l'iPhone.</span></div><button class="btn primary" onclick="document.getElementById('photoInput').click()">＋ Photo</button></div><input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="addPhoto(event)"><div class="three">${list.map(x=>`<div class="card"><img src="${x.data}" style="width:100%;border-radius:10px;max-height:250px;object-fit:cover"><p><b>${esc(x.note||'Photo chantier')}</b></p><button class="btn sm danger" onclick="del('photos','${x.id}')">Supprimer</button></div>`).join('')}</div>${!list.length?'<div class="card empty">Aucune photo pour ce chantier.</div>':''}`}
function addPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.photos.push({id:uid(),projectId:pid(),data:r.result,note:f.name});save()};r.readAsDataURL(f)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Spids_Manager_Sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.projects)throw Error();db=x;save();alert('Sauvegarde restaurée.')}catch(_){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
function resetAll(){if(confirm('ATTENTION : supprimer toutes les données locales de Spids Manager ?')){localStorage.removeItem(KEY);location.reload()}}

render();
</script>
</body>
</html>
