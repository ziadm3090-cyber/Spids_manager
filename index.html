<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spids Manager">
<meta name="mobile-web-app-capable" content="yes">

<title>Spids Manager</title>

<style>
:root{
--bg:#f4f6f8;
--card:#fff;
--text:#17202a;
--muted:#667085;
--primary:#111827;
--line:#e5e7eb;
--accent:#2563eb;
--ok:#0f9d58;k
--danger:#dc3545
}

*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select,textarea{
font:inherit
}

button{
cursor:pointer
}

.top{
position:sticky;
top:0;
z-index:20;
background:var(--primary);
color:#fff;
padding:13px 16px;
display:flex;
justify-content:space-between;
align-items:center
}

.brand{
font-size:20px;
font-weight:800
}

.brand small{
display:block;
font-size:11px;
opacity:.7
}

.mobileMenu{
border:0;
background:#263142;
color:#fff;
border-radius:9px;
padding:8px 11px;
font-size:20px
}

.layout{
display:flex;
min-height:calc(100vh - 62px)
}

.side{
width:245px;
background:#fff;
border-right:1px solid var(--line);
padding:14px;
flex-shrink:0
}

.nav button{
width:100%;
border:0;
background:transparent;
text-align:left;
padding:11px;
border-radius:10px;
margin-bottom:4px;
color:#374151
}

.nav button.active,
.nav button:hover{
background:#eef2ff;
color:#1d4ed8;
font-weight:700
}

.main{
flex:1;
padding:18px;
max-width:1450px;
margin:auto;
width:100%
}

.pageTitle{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
margin-bottom:16px
}

.pageTitle h1{
margin:0;
font-size:25px
}

.muted{
color:var(--muted);
font-size:13px
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:10px;
padding:10px 14px;
background:var(--primary);
color:#fff;
font-weight:650
}

.btn.blue{
background:var(--accent)
}

.btn.green{
background:var(--ok)
}

.btn.red{
background:var(--danger)
}

.btn.light{
background:#eef2f7;
color:#111827
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px
}

.card{
background:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:15px;
box-shadow:0 2px 8px #00000008
}

.value{
font-size:24px;
font-weight:800;
margin-top:7px
}

.section{
margin-top:16px
}

.tableWrap{
overflow:auto
}

.table{
width:100%;
border-collapse:collapse;
min-width:700px
}

.table th,
.table td{
padding:10px;
border-bottom:1px solid var(--line);
text-align:left;
font-size:14px
}

.table th{
background:#f8fafc
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:999px;
background:#e8eefc;
font-size:12px
}

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:5px
}

.field input,
.field select,
.field textarea{
width:100%;
padding:10px;
border:1px solid #d1d5db;
border-radius:9px;
background:#fff
}

.full{
grid-column:1/-1
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:50;
align-items:center;
justify-content:center;
padding:16px
}

.modal.show{
display:flex
}

.modalBox{
background:#fff;
border-radius:17px;
padding:18px;
width:min(680px,100%);
max-height:90vh;
overflow:auto
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px
}

.close{
border:0;
background:#eef2f7;
border-radius:8px;
padding:7px 10px
}

.spacebar{
display:flex;
gap:7px;
overflow:auto;
margin-bottom:14px
}

.spacebar button{
border:1px solid var(--line);
background:#fff;
border-radius:9px;
padding:9px 12px;
white-space:nowrap
}

.spacebar button.active{
background:#111827;
color:#fff
}

.siteGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}

.siteCard{
cursor:pointer
}

.siteCard:hover{
border-color:#2563eb
}

.empty{
padding:30px;
text-align:center;
color:var(--muted)
}

@media(max-width:900px){
.cards{
grid-template-columns:1fr 1fr
}

.siteGrid{
grid-template-columns:1fr 1fr
}
}

@media(max-width:700px){

.mobileMenu{
display:block
}

.side{
display:none;
position:fixed;
top:62px;
bottom:0;
left:0;
z-index:40;
width:275px;
box-shadow:5px 0 20px #0002
}

.side.open{
display:block
}

.layout{
display:block
}

.main{
padding:13px
}

.form{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.cards,
.siteGrid{
grid-template-columns:1fr 1fr
}

.pageTitle{
align-items:flex-start
}

.pageTitle h1{
font-size:21px
}
}

@media(max-width:430px){

.cards,
.siteGrid{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<header class="top">

<div>
<div class="brand">🏗️ Spids Manager</div>
<small id="spaceLabel">Espace Personal</small>
</div>

<button class="mobileMenu" onclick="toggleMenu()">☰</button>

</header>

<div class="layout">

<aside class="side" id="side">

<nav class="nav" id="nav"></nav>

</aside>

<main class="main" id="main"></main>

</div>

<div class="modal" id="modal">

<div class="modalBox" id="modalBox"></div>

</div>

<script>

const KEY="spids_manager_v7";

const empty={
chantiers:[],
workers:[],
materials:[],
expenses:[],
incomes:[],
invoices:[],
clients:[],
agencies:[],
meetings:[],
planning:[],
documents:[],
photos:[],
metres:[]
};

let db=JSON.parse(localStorage.getItem(KEY)||"null")||empty;

if(!db.metres){
db.metres=[]
}

let space=localStorage.getItem("spids_space")||"Personal";

let page=location.hash.slice(1)||"dashboard";

const nav=[

["dashboard","📊","Dashboard"],

["metre","📐","Métré"],

["chantiers","🏗️","Chantiers"],

["workers","👷","Ouvriers"],

["materials","🧱","Matériaux & Stock"],

["expenses","💸","Dépenses"],

["incomes","💰","Recettes"],

["invoices","🧾","Factures"],

["clients","👤","Clients"],

["agencies","🤝","Agences / Associés"],

["planning","🗓️","Planning"],

["meetings","📅","Réunions"],

["documents","📁","Documents"],

["photos","📷","Photos"],

["reports","📈","Rapports"],

["settings","⚙️","Paramètres"]

];

function save(){

localStorage.setItem(KEY,JSON.stringify(db))

}

function money(n){

return Number(n||0).toLocaleString(
"fr-MA",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
)+" DH"

}

function esc(s){

return String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
)

}

function id(){

return Date.now().toString(36)+Math.random().toString(36).slice(2,7)

}

function toggleMenu(){

document.getElementById("side").classList.toggle("open")

}

function setSpace(s){

space=s;

localStorage.setItem("spids_space",s);

render()

}

function go(p){

page=p;

location.hash=p;

document.getElementById("side").classList.remove("open");

render()

}

function renderNav(){

document.getElementById("spaceLabel").textContent=
"Espace "+space;

document.getElementById("nav").innerHTML=

nav.map(n=>

`<button class="${page==n[0]?"active":""}"
onclick="go('${n[0]}')">

${n[1]} ${n[2]}

</button>`

).join("")

}

function title(h,s="",b=""){

return `

<div class="pageTitle">

<div>

<h1>${h}</h1>

${s?`<div class="muted">${s}</div>`:""}

</div>

${b?`<div class="actions">${b}</div>`:""}

</div>

`

}

function add(label,type){

return `<button class="btn blue"
onclick="openForm('${type}')">

＋ ${label}

</button>`

}

function table(headers,rows){

return rows.length?

`<div class="tableWrap">

<table class="table">

<thead>

<tr>

${headers.map(x=>`<th>${x}</th>`).join("")}

</tr>

</thead>

<tbody>

${rows.join("")}

</tbody>

</table>

</div>`

:

`<div class="empty">

Aucune donnée pour le moment.

</div>`

}

function del(type,i){

if(confirm("Supprimer cet élément ?")){

db[type].splice(i,1);

save();

render()

}

}

function render(){

renderNav();

let fn={

dashboard,

metre,

chantiers,

workers,

materials,

expenses,

incomes,

invoices,

clients,

agencies,

planning,

meetings,

documents,

photos,

reports,

settings

}[page]||dashboard;

fn()

}

render();

</script>

</body>
</html>
